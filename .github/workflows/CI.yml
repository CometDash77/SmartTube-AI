name: Build, test and publish stbeta test APK

# Delivery path of plan section 15: compilation, lint, unit tests, APK assembly and
# signature verification run on GitHub, and the verified APKs are published as a
# prerelease acceptance candidate. The working branch is production; master is kept so
# the previous trigger keeps working, and manual dispatch can run any ref.
on:
  push:
    branches: [ "master", "production" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (JDK 11, subtitle/export scope)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      # Robolectric 4.6.1 in this repository cannot run on JDK 17, so the unit tests use
      # JDK 11 while the release build and lint stay on JDK 17 (plan section 15).
      - name: Set up JDK 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # Required gate for this task: the AI subtitle and local export package.
      - name: Required test scope (exoplayer.other)
        run: ./gradlew :common:testStbetaDebugUnitTest --tests "com.liskovsoft.smartyoutubetv2.common.exoplayer.other.*"

      # Informational only: the complete module task carries two pre-existing
      # ScreensaverManagerTest failures that predate this work, so it must never be read
      # as "the module is green". The required gate is the step above.
      - name: Full common module suite (informational baseline, known failures)
        continue-on-error: true
        run: ./gradlew :common:testStbetaDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn

  publish:
    name: Lint, build, verify and publish prerelease (JDK 17)
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write
    env:
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          # Keep the original code so nightly and original builds stay interchangeable
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-nightly-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Lint (stbeta release)
        run: ./gradlew :common:lintStbetaRelease :smarttubetv:lintStbetaRelease

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      # Signs with the project identity when the four secrets exist (plan section 15).
      # Without them it still produces an installable APK, but as a clearly labelled
      # debug-signed fallback: the release variant would be unsigned and uninstallable,
      # and generating a throwaway signing key to hide that is explicitly not allowed.
      - name: Configure signing and assemble
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          missing=""
          if [ -z "$SIGNING_KEY" ]; then missing="$missing SIGNING_KEY"; fi
          if [ -z "$KEY_STORE_PASSWORD" ]; then missing="$missing KEY_STORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then missing="$missing KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then missing="$missing KEY_PASSWORD"; fi

          if [ -n "$missing" ]; then
            echo "::warning::Missing repository secrets:$missing. Publishing a DEBUG-signed fallback candidate instead of an unsigned release build."
            {
              echo "SIGNING_LABEL=**debug-signed fallback**: the four signing secrets were not configured, so this APK is signed with the AGP debug keystore generated on this runner. It cannot update an installed build signed with another key, and a later CI run uses a different debug key. Configure SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS and KEY_PASSWORD to get a project-signed build."
              echo "TAG_SUFFIX=-debug"
            } >> "$GITHUB_ENV"
            ./gradlew clean :smarttubetv:assembleStbetaDebug
          else
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreFile=%s\n' \
              "$KEY_STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$GITHUB_WORKSPACE/key.jks" > keystore.properties
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
            {
              echo "SIGNING_LABEL=release build signed with the project signing identity from GitHub Secrets"
              echo "TAG_SUFFIX="
            } >> "$GITHUB_ENV"
            ./gradlew clean :smarttubetv:assembleStbetaRelease
          fi

      - name: Verify signatures and build the checksum manifest
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1 || true)

          if ls smarttubetv/build/outputs/apk/stbeta/release/*.apk > /dev/null 2>&1; then
            APK_DIR=smarttubetv/build/outputs/apk/stbeta/release
          else
            APK_DIR=smarttubetv/build/outputs/apk/stbeta/debug
          fi
          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          echo "Using APKs from $APK_DIR"

          mkdir -p publish
          : > SHA256SUMS.txt
          : > NOTES.md

          {
            echo "## SmartTube - stbeta test candidate for T13 acceptance"
            echo ""
            echo "This is a **prerelease test build**, not a release. Commit: $GITHUB_SHA"
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Signing identity: $SIGNING_LABEL"
            echo ""
            echo "### What to verify on the TV"
            echo ""
            echo "1. Long-press the closed-caption button, then use the two new entries at the bottom of the subtitle menu: **Export subtitles** and **Export diagnostic log**."
            echo "2. After the completion dialog, open a TV file manager and check Documents/SmartTube/Exports/; the dialog shows the exact file name and path."
            echo "3. The diagnostic export must also work with AI off, without a key and without a subtitle timeline."
            echo "4. Playback must keep running while an export is in progress."
            echo ""
            echo "### Known limits of this candidate"
            echo ""
            echo "- Remote focus, file-manager visibility, storage-permission refusal, out-of-space feedback and playback continuity are **not yet device-verified**: that is what this build is for."
            echo "- versionCode is the project value and was not bumped, so it installs over an equally versioned build; Android refuses an update signed with a different certificate."
            echo "- Package name is org.smarttube.beta (stbeta flavor). If a differently signed build with that package is installed, Android refuses this APK: back up before uninstalling anything."
            echo "- No real DeepSeek request is needed for this feature and the export makes none."
            echo ""
            echo "### APK metadata and signature"
            echo ""
          } >> NOTES.md

          for apk in "$APK_DIR"/*.apk; do
            name=$(basename "$apk")
            cp "$apk" "publish/$name"
            sha256sum "$apk" >> SHA256SUMS.txt
            {
              echo "#### $name"
              echo ""
              echo "```"
              if [ -x "$AAPT" ]; then
                "$AAPT" dump badging "$apk" 2>/dev/null | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" || true
              else
                echo "aapt unavailable in this runner"
              fi
              "$APKSIGNER" verify --print-certs "$apk" | grep -E "SHA-256 digest|Signer #1 certificate DN" || true
              echo "```"
              echo ""
            } >> NOTES.md
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

          echo "--- Signature verification and checksums ---"
          cat SHA256SUMS.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
        run: |
          set -e
          TAG="stbeta-$VERSION_NAME-$GITHUB_RUN_NUMBER$TAG_SUFFIX"
          echo "Publishing prerelease $TAG"
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$VERSION_NAME (T13 acceptance candidate, run $GITHUB_RUN_NUMBER)" \
            --notes-file NOTES.md \
            publish/*.apk SHA256SUMS.txt
          {
            echo "### Prerelease published"
            echo ""
            echo "- tag: $TAG"
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "```"
            cat SHA256SUMS.txt
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_stbeta
          path: publish/*.apk
          if-no-files-found: warn

      # Optional third-party upload. Disabled for the automatic delivery path (plan
      # section 15); it only runs on an explicit manual dispatch when the key exists.
      - name: VirusTotal Scan
        if: ${{ env.HAS_VT_KEY == 'true' && github.event_name == 'workflow_dispatch' }}
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            ./publish/*.apk
          request_rate: 4
