name: Build, test and publish stbeta APK

# Delivery path of plan sections 15 and 18.6: compilation, lint, unit tests, APK assembly and
# signature verification run on GitHub, and verified APKs are published as a unique prerelease
# acceptance candidate. The working branch is production; master is kept so the previous trigger
# keeps working, and manual dispatch can run any ref.
#
# Dispatch input release_mode=true is the final-RC path: it requires the four signing secrets and
# fails instead of falling back to a debug-signed build, so a stable release candidate can never be
# produced by accident.
on:
  push:
    branches: [ "master", "production" ]
    # A documentation-only change needs document checks, not an APK build (plan sections 15/18.6), and
    # must not create another same-code acceptance candidate. Manual dispatch still builds any ref.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Publish a stable-signed release candidate (needs the four signing secrets; fails instead of a debug fallback)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (JDK 11, subtitle/export scope)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      # Robolectric 4.6.1 in this repository cannot run on JDK 17, so the unit tests use
      # JDK 11 while the release build and lint stay on JDK 17 (plan section 15).
      - name: Set up JDK 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Update feed contract tests
        run: python3 -B scripts/test_create_update_manifest.py

      # Required gate for this task: the AI subtitle and local export package.
      - name: Required test scope (exoplayer.other)
        run: ./gradlew :common:testStbetaDebugUnitTest --tests "com.liskovsoft.smartyoutubetv2.common.exoplayer.other.*"

      # The complete module task is a gate as well: the two historical ScreensaverManagerTest failures
      # were fixed on 2026-09-20 by driving the real pause+stop lifecycle (the production suspend lives
      # on onStop), so the module is green and must not be hidden behind continue-on-error. Its result
      # count is printed only when something fails; a green run reports no count.
      - name: Full common module suite
        run: ./gradlew :common:testStbetaDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn

  publish:
    name: Lint, build, verify and publish prerelease (JDK 17)
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write
    env:
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}
      RELEASE_MODE: ${{ github.event.inputs.release_mode == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # Version strategy (plan 18.6): versionCode in smarttubetv/build.gradle is the reserved number
      # of the next STABLE release. Every development/acceptance candidate gets versionCode-1, so a
      # candidate installs over anything already released and the following stable still upgrades over
      # the candidate, while nightly candidates never consume future stable numbers.
      # A stable release candidate keeps the plain versionName, so the accepted APK can be published
      # as stable with no rebuild.
      - name: Resolve version, signing and build variant
        id: version
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          BASE_CODE=$(grep -oE 'versionCode [0-9]+' smarttubetv/build.gradle | head -1 | awk '{print $2}')
          BASE_NAME=$(grep -oE 'versionName "[^"]+"' smarttubetv/build.gradle | head -1 | sed -E 's/versionName "([^"]+)"/\1/')
          if [ -z "$BASE_CODE" ] || [ -z "$BASE_NAME" ]; then
            echo "::error::Could not read versionCode/versionName from smarttubetv/build.gradle"
            exit 1
          fi

          missing=""
          if [ -z "$SIGNING_KEY" ]; then missing="$missing SIGNING_KEY"; fi
          if [ -z "$KEY_STORE_PASSWORD" ]; then missing="$missing KEY_STORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then missing="$missing KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then missing="$missing KEY_PASSWORD"; fi

          if [ "$RELEASE_MODE" = "true" ] && [ -n "$missing" ]; then
            echo "::error::release_mode requested a stable-signed release candidate, but these repository secrets are missing:$missing. No debug fallback is published and nothing is released (plan 18.6)."
            exit 1
          fi

          if [ -n "$missing" ]; then
            echo "::warning::Missing repository secrets:$missing. Publishing a DEBUG-signed development candidate (explicitly not a release candidate)."
            VERSION_CODE=$((BASE_CODE - 1))
            VERSION_NAME="$BASE_NAME-nightly-$GITHUB_RUN_NUMBER"
            BUILD_TASK=":smarttubetv:assembleStbetaDebug"
            TAG="stbeta-$VERSION_NAME-$GITHUB_RUN_NUMBER-debug"
            SIGNING_LABEL="**debug-signed development candidate**: the four signing secrets were not configured, so this APK is signed with the AGP debug keystore generated on this runner. It is NOT a stable release candidate, it cannot update a build signed with another key, and a later CI run uses a different debug key. Configure SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS and KEY_PASSWORD for a project-signed candidate."
          else
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreFile=%s\n' \
              "$KEY_STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$GITHUB_WORKSPACE/key.jks" > keystore.properties
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
            if [ "$RELEASE_MODE" = "true" ]; then
              VERSION_CODE=$BASE_CODE
              VERSION_NAME="$BASE_NAME"
              TAG="stbeta-$BASE_NAME-rc$GITHUB_RUN_NUMBER"
              SIGNING_LABEL="release build signed with the project signing identity from GitHub Secrets. This is the stable release candidate: the accepted APK is byte-identical to the build that can be published as the stable release."
            else
              VERSION_CODE=$((BASE_CODE - 1))
              VERSION_NAME="$BASE_NAME-nightly-$GITHUB_RUN_NUMBER"
              TAG="stbeta-$VERSION_NAME-$GITHUB_RUN_NUMBER"
              SIGNING_LABEL="release build signed with the project signing identity from GitHub Secrets."
            fi
            BUILD_TASK=":smarttubetv:assembleStbetaRelease"
          fi

          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" smarttubetv/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/" smarttubetv/build.gradle

          {
            echo "VERSION_CODE=$VERSION_CODE"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "BUILD_TASK=$BUILD_TASK"
            echo "TAG=$TAG"
            echo "SIGNING_LABEL=$SIGNING_LABEL"
            echo "RELEASE_MODE=$RELEASE_MODE"
          } >> "$GITHUB_OUTPUT"

          echo "Building $BUILD_TASK as $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Lint (stbeta release)
        run: ./gradlew :common:lintStbetaRelease :smarttubetv:lintStbetaRelease

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      - name: Assemble the APKs
        run: ./gradlew clean ${{ steps.version.outputs.BUILD_TASK }}

      - name: Verify signatures and build the checksum manifest
        env:
          SIGNING_LABEL: ${{ steps.version.outputs.SIGNING_LABEL }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          RELEASE_MODE: ${{ steps.version.outputs.RELEASE_MODE }}
          TAG: ${{ steps.version.outputs.TAG }}
          EXPECT_PROJECT_SIGNATURE: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1 || true)

          if ls smarttubetv/build/outputs/apk/stbeta/release/*.apk > /dev/null 2>&1; then
            APK_DIR=smarttubetv/build/outputs/apk/stbeta/release
          else
            APK_DIR=smarttubetv/build/outputs/apk/stbeta/debug
          fi
          echo "Using APKs from $APK_DIR"

          mkdir -p publish
          : > SHA256SUMS.txt
          : > NOTES.md

          {
            echo "## SmartTube stbeta $VERSION_NAME (versionCode $VERSION_CODE)"
            echo ""
            if [ "$RELEASE_MODE" = "true" ]; then
              echo "This is the **stable release candidate**: a prerelease for acceptance. The accepted APK is byte-identical to the build that can be published as the stable release."
            else
              echo "This is a **prerelease development candidate**, not a release."
            fi
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Signing identity: $SIGNING_LABEL"
            echo ""
            echo "### What to verify on the TV"
            echo ""
            echo "1. Long-press the closed-caption button and use the AI area of the subtitle menu: per-video translation switch, target language, the three display modes, the status line, and the AI settings/config-key entries."
            echo "2. Configure the service key there (masked input), then play a video with text subtitles and check the original/translated/bilingual modes, seek and track changes."
            echo "3. Export subtitles and the diagnostic log; the completion dialog shows the exact file name and path under Documents/SmartTube/Exports/."
            echo "4. The subtitle export must work with AI off and without a key, and playback must keep running while an export is in progress."
            echo ""
            echo "### Known limits of this candidate"
            echo ""
            echo "- Remote focus, file-manager visibility, storage-permission refusal, out-of-space feedback and playback continuity are device checks; report what you observe."
            echo "- Version strategy: versionCode $VERSION_CODE. Development candidates use the reserved stable number minus one, so they never consume future stable numbers; the stable release of this line uses the reserved number itself."
            echo "- Package name is org.smarttube.beta (stbeta flavor). Android refuses an update signed with a different certificate: a debug-signed or official build of the same package must be uninstalled first, which discards its data."
            echo "- Real DeepSeek calls are only made while translation is switched on and a key is configured."
            echo ""
            echo "### APK metadata and signature"
            echo ""
          } >> NOTES.md

          for apk in "$APK_DIR"/*.apk; do
            name=$(basename "$apk")
            cp "$apk" "publish/$name"
            (cd publish && sha256sum "$name") >> SHA256SUMS.txt
            {
              echo "#### $name"
              echo ""
              echo '```'
              if [ -x "$AAPT" ]; then
                "$AAPT" dump badging "$apk" 2>/dev/null | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" || true
              else
                echo "aapt unavailable in this runner"
              fi
              "$APKSIGNER" verify --print-certs "$apk" | grep -E "SHA-256 digest|Signer #1 certificate DN" || true
              echo '```'
              echo ""
            } >> NOTES.md
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            if [ "$EXPECT_PROJECT_SIGNATURE" = "true" ]; then
              EXPECTED=$(tr -d '\r\n' < docs/release/signing-certificate.sha256)
              ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo '::error::APK certificate does not match the pinned project identity'
                exit 1
              fi
            fi
          done

          python3 scripts/create-update-manifest.py --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" --version "$VERSION_NAME" --code "$VERSION_CODE" \
            --apk-dir publish --output publish/smarttube-ai.json
          (cd publish && sha256sum smarttube-ai.json) >> SHA256SUMS.txt

          echo "--- Signature verification and checksums ---"
          cat SHA256SUMS.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.TAG }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          set -e
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$VERSION_NAME (stbeta acceptance candidate, run $GITHUB_RUN_NUMBER)" \
            --notes-file NOTES.md \
            publish/*.apk publish/smarttube-ai.json SHA256SUMS.txt
          {
            echo "### Prerelease published"
            echo ""
            echo "- tag: $TAG"
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.version.outputs.VERSION_NAME }}_stbeta
          path: publish/*.apk
          if-no-files-found: warn

      # Optional third-party upload. Disabled for the automatic delivery path (plan section 15);
      # it only runs on an explicit manual dispatch when the key exists.
      - name: VirusTotal Scan
        if: ${{ env.HAS_VT_KEY == 'true' && github.event_name == 'workflow_dispatch' }}
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            ./publish/*.apk
          request_rate: 4
